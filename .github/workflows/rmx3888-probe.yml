name: RMX3888 compile-only probe
on:
  workflow_dispatch:
  push:
    branches: [rmx3888-build-probe]
    paths: [.github/workflows/rmx3888-probe.yml, devices/rmx3888.toml, crates/skyward-config/tests/rmx3888.rs, "crates/skyward-pack/src/**"]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Validate RMX3888 configuration
        run: cargo test --locked -p skyward-config --test rmx3888
      - name: Install Android NDK r29
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
          add-to-path: false
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Compile Android service
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward
      - name: Compile second system init
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward-system-init --target-dir target/system-init
      - name: Test port compatibility audit
        run: cargo test --locked -p skyward-pack port_audit
      - name: Compile host packer
        run: cargo build --locked --release -p skyward-pack
      - name: Collect binaries (not a recovery image)
        run: |
          mkdir -p out
          cp target/aarch64-linux-android/release/skyward out/
          cp target/system-init/aarch64-linux-android/release/system-init out/
          cp target/release/skyward-pack out/
          echo 'Compile-only binaries; NOT a flashable recovery image.' > out/NOT_FLASHABLE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rmx3888-compile-only-not-flashable
          path: out/
          if-no-files-found: error
          retention-days: 7
